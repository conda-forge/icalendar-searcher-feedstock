{% set name = "icalendar-searcher" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/icalendar_searcher-{{ version }}.tar.gz
  sha256: 14978379670385b837a580c2ee95665b18ae80169a0b7e12abfc503c049c57a9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling >=1.27.0
    - hatch-vcs
    - setuptools-scm >=9
    - pip
  run:
    - python >={{ python_min }}
    - icalendar >=6.2.0
    - recurring-ical-events >=3.8.0

test:
  imports:
    - icalendar_searcher
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/python-caldav/icalendar-searcher
  summary: Search, filter and sort iCalendar components
  license: GPL-3.0-or-later OR Apache-2.0
  license_file:
    - COPYING.GPL
    - COPYING.APACHE

extra:
  recipe-maintainers:
    - tdido
