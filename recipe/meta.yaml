{% set name = "icalendar-searcher" %}
{% set version = "1.0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/icalendar_searcher-{{ version }}.tar.gz
  sha256: 2440d4d0d9fbe0021a6647916853744dbca179abd39d25c742ebb8442bbc1bc3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - icalendar >=6.0
    - recurring-ical-events >=3.8.0

test:
  imports:
    - icalendar_searcher
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/python-caldav/icalendar-searcher
  summary: Search, filter and sort iCalendar components
  license: AGPL-3.0-only
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - tdido
